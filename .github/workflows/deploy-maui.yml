name: Deploy MAUI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/deploy-maui
        with:
          platform: android

  windows:
    runs-on: windows-latest
    steps:
      - uses: ./.github/actions/deploy-maui
        with:
          platform: windows
