name: Deploy

on:
  workflow_dispatch:
    inputs:
      run_api:
        description: Deploy API (imagen GHCR enigma-server)
        type: boolean
        default: true
      run_web:
        description: Deploy Web (Cloudflare Pages)
        type: boolean
        default: true
      run_maui:
        description: Deploy MAUI (APK Android + instalador Windows)
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  api:
    if: ${{ inputs.run_api }}
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: ./.github/actions/deploy-api

  web:
    if: ${{ inputs.run_web }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: ./.github/actions/deploy-web

  maui-android:
    if: ${{ inputs.run_maui }}
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/deploy-maui
        with:
          platform: android

  maui-windows:
    if: ${{ inputs.run_maui }}
    runs-on: windows-latest
    steps:
      - uses: ./.github/actions/deploy-maui
        with:
          platform: windows
