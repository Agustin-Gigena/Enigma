name: Sync DB Snapshots
description: Toma la ultima imagen GHCR del package de la rama (o mysql:8 + seed para bootstrap), aplica las migraciones EF Core del checkout (dotnet ef database update), commitea y pushea como nueva version. Adaptado a Enigma (.NET 10 + EF Core + Microting.EntityFrameworkCore.MySql).

outputs:
  version:
    description: "Version de la ultima migracion aplicada (tag Version<timestamp>, derivado del filename Server/Data/Migrations/<timestamp>_<name>.cs)"
    value: ${{ steps.build.outputs.version }}
  pushed:
    description: "true si se commiteo y pusheo una nueva imagen, false si se skipo"
    value: ${{ steps.build.outputs.pushed }}

runs:
  using: "composite"
  steps:
    # ── 1. Login GHCR ──────────────────────────────────────────
    - name: Login to GHCR
      shell: bash
      env:
        GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
      run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    # ── 2. Setup .NET SDK + dotnet-ef + restore ─────────────────
    - name: Setup .NET + dotnet-ef
      uses: ./.github/actions/setup-dotnet

    # ── 3. Build: resolve base, migrate, commit ────────────────
    # mysql:8 declara VOLUME /var/lib/mysql — docker commit no captura
    # volumenes. Usamos datadir custom (/var/lib/mysql-baked) + un .cnf
    # baked para que los contenedores derivados lo usen por defecto.
    - name: Build and migrate image
      id: build
      shell: bash
      env:
        GHCR_PREFIX: ${{ env.GHCR_PREFIX }}
        SEED_SQL: ${{ env.SEED_SQL }}
        MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
        MYSQL_DATABASE: ${{ env.MYSQL_DATABASE }}
        FORCE: ${{ env.FORCE }}
        AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: us-east-1
        ASPNETCORE_ENVIRONMENT: Development
      run: |
        set -euo pipefail

        # El nombre de la database es fijo para Enigma.
        MYSQL_DATABASE="${MYSQL_DATABASE:-enigma_db}"

        # ── Resolve base image + seed source ─────────────────────
        SEED_FILE=""
        if [ -n "${SEED_SQL}" ]; then
          BASE_IMAGE="mysql:8"
          BOOTSTRAP=true
          if [[ "${SEED_SQL}" == s3://* ]]; then
            SEED_FILE="/tmp/seed.sql"
            echo "Bootstrap mode: base=${BASE_IMAGE}, downloading seed from ${SEED_SQL}"
            aws s3 cp "${SEED_SQL}" "${SEED_FILE}" --no-progress
          elif [ -f "${SEED_SQL}" ]; then
            SEED_FILE="${SEED_SQL}"
            echo "Bootstrap mode: base=${BASE_IMAGE}, seed=${SEED_SQL}"
          else
            echo "::error::seed-sql not found and not an s3:// URI: ${SEED_SQL}"
            exit 1
          fi
        else
          BASE_IMAGE="${GHCR_PREFIX}:latest"
          BOOTSTRAP=false
          echo "Incremental mode: pulling ${BASE_IMAGE}"
          if ! docker pull "${BASE_IMAGE}"; then
            echo "::error::Base image ${BASE_IMAGE} not found. Run the workflow with seed-sql to bootstrap the first image for this branch package."
            exit 1
          fi
        fi

        # ── Start container with custom datadir (bypass VOLUME) ─
        docker rm -f builder 2>/dev/null || true
        docker run -d --name builder \
          -e MYSQL_ROOT_PASSWORD="${MYSQL_ROOT_PASSWORD}" \
          "${BASE_IMAGE}" \
          --datadir=/var/lib/mysql-baked

        # Wait for MySQL to be ready
        ready=false
        for i in $(seq 1 60); do
          if docker exec builder mysql -uroot -p"${MYSQL_ROOT_PASSWORD}" -e "SELECT 1" >/dev/null 2>&1; then
            echo "MySQL is ready"
            ready=true
            break
          fi
          echo "Waiting for MySQL... ($i/60)"
          sleep 2
        done

        if [ "${ready}" = "false" ]; then
          echo "::error::MySQL did not become ready in time"
          docker logs builder || true
          exit 1
        fi

        # ── Bootstrap: import seed into a fresh database ────────
        if [ "${BOOTSTRAP}" = "true" ]; then
          docker exec builder mysql -uroot -p"${MYSQL_ROOT_PASSWORD}" \
            -e "CREATE DATABASE IF NOT EXISTS \`${MYSQL_DATABASE}\`;"
          docker exec -i builder mysql -uroot -p"${MYSQL_ROOT_PASSWORD}" "${MYSQL_DATABASE}" < "${SEED_FILE}"
          echo "Seed imported into ${MYSQL_DATABASE}"
        fi

        # ── Resolve builder container IP (host visible from runner) ─
        CONTAINER_IP=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' builder)
        if [ -z "${CONTAINER_IP}" ]; then
          echo "::error::Could not resolve builder container IP"
          exit 1
        fi

        # ── V_BASE: latest applied migration tag in GHCR base image ─
        # The base image (if incremental) was commited from a prior run at some
        # migration version. We can't query the applied state before migrating
        # without a second ef call — derive V_BASE from the latest tag already
        # published in this package (via gh api). For bootstrap, V_BASE=none.
        V_BASE="none"
        if [ "${BOOTSTRAP}" != "true" ]; then
          # GHCR package owner may be a user or an org. Detect type and hit the
          # right REST endpoint (/users/<owner>/packages/... vs /orgs/<owner>/...).
          PACKAGE_OWNER=$(echo "${GHCR_PREFIX}" | awk -F'/' '{print $2}')
          PACKAGE_NAME=$(echo "${GHCR_PREFIX}" | awk -F'/' '{print $3}')
          OWNER_TYPE="users"
          if gh api "/orgs/${PACKAGE_OWNER}" >/dev/null 2>&1; then
            OWNER_TYPE="orgs"
          fi
          API_BASE="${OWNER_TYPE}/${PACKAGE_OWNER}/packages/container/${PACKAGE_NAME}"
          V_BASE=$(gh api "${API_BASE}/versions" --paginate 2>/dev/null \
            --jq '[.[].metadata.container.tags // [] | .[] | select(startswith("Version"))] | sort | .[-1] // empty' \
            || echo "")
        fi
        echo "Version before migrate: ${V_BASE:-none}"

        # ── Build Server 
        dotnet build Server/Enigma.Server.csproj

        # ── Migrate via dotnet ef database update ───────────────
        # Program.cs + EnigmaDbContextFactory assemble the connection string
        # from MYSQL_* env vars. Point them at the builder container.
        export MYSQL_HOST="${CONTAINER_IP}"
        export MYSQL_PORT="3306"
        export MYSQL_DATABASE="${MYSQL_DATABASE}"
        export MYSQL_USER="root"
        export MYSQL_PASSWORD="${MYSQL_ROOT_PASSWORD}"

        dotnet dotnet-ef database update --project Server

        # ── V_NEW: latest migration by filesystem timestamp ─────
        # Parse Server/Data/Migrations/<timestamp>_<name>.cs (exclude
        # Designer and Snapshot). sort -r | head -1 → newest timestamp.
        MIGRATIONS_DIR="Server/Data/Migrations"
        if [ ! -d "${MIGRATIONS_DIR}" ]; then
          echo "::error::Migrations dir not found: ${MIGRATIONS_DIR}"
          docker stop -t 60 builder || true
          docker rm builder || true
          exit 1
        fi
        MIG_FILE=$(ls "${MIGRATIONS_DIR}"/*.cs 2>/dev/null \
          | grep -vE "Designer\.cs$|Snapshot\.cs$" \
          | sort -r \
          | head -1)
        if [ -z "${MIG_FILE}" ]; then
          echo "::error::No migration files found in ${MIGRATIONS_DIR}"
          docker stop -t 60 builder || true
          docker rm builder || true
          exit 1
        fi
        V_NEW="Version$(basename "${MIG_FILE}" | sed -E 's/^([0-9]+)_.*/\1/')"
        echo "Version after migrate:  ${V_NEW}"

        # ── Skip if nothing changed (unless force or bootstrap) ─
        if [ "${FORCE}" != "true" ] && [ "${BOOTSTRAP}" != "true" ] && [ "${V_NEW}" = "${V_BASE}" ]; then
          echo "No new migrations (version unchanged at ${V_NEW}). Skipping commit/push."
          docker stop -t 60 builder
          docker rm builder
          echo "pushed=false" >> "${GITHUB_OUTPUT}"
          echo "version=${V_NEW}" >> "${GITHUB_OUTPUT}"
          exit 0
        fi

        # ── Configure baked datadir for derived containers ──────
        docker exec builder bash -c 'printf "[mysqld]\ndatadir=/var/lib/mysql-baked\n" > /etc/mysql/conf.d/baked-datadir.cnf'

        # Graceful stop — MySQL flushes data to disk
        docker stop -t 60 builder
        echo "MySQL stopped gracefully"

        # ── Commit with version + latest tags ───────────────────
        # Un package por rama: el branch vive en el nombre del package.
        # Las "revisiones" son los tags Version*; latest es móvil por rama.
        docker commit builder "${GHCR_PREFIX}:${V_NEW}"
        docker tag  "${GHCR_PREFIX}:${V_NEW}" "${GHCR_PREFIX}:latest"
        echo "Image tagged: ${V_NEW}, latest"

        docker rm builder

        echo "pushed=true" >> "${GITHUB_OUTPUT}"
        echo "version=${V_NEW}" >> "${GITHUB_OUTPUT}"

    # ── 4. Push version + latest tags ──────────────────────────
    - name: Push image to GHCR
      if: steps.build.outputs.pushed == 'true'
      shell: bash
      env:
        GHCR_PREFIX: ${{ env.GHCR_PREFIX }}
        VERSION: ${{ steps.build.outputs.version }}
      run: |
        set -euo pipefail
        docker push "${GHCR_PREFIX}:${VERSION}"
        docker push "${GHCR_PREFIX}:latest"
        echo "Pushed: ${GHCR_PREFIX}:${VERSION} and :latest"

    # ── 5. Cleanup old Version tags (keep latest 10) ───────────
    # Preserva la package version con tag latest (build actual).
    # Borra las que solo tengan tags Version* antiguos.
    - name: Cleanup old GHCR versions
      if: steps.build.outputs.pushed == 'true'
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ env.GITHUB_TOKEN }}
        GHCR_PREFIX: ${{ env.GHCR_PREFIX }}
      run: |
        set -euo pipefail

        PACKAGE_OWNER=$(echo "${GHCR_PREFIX}" | awk -F'/' '{print $2}')
        PACKAGE_NAME=$(echo "${GHCR_PREFIX}" | awk -F'/' '{print $3}')
        OWNER_TYPE="users"
        if gh api "/orgs/${PACKAGE_OWNER}" >/dev/null 2>&1; then
          OWNER_TYPE="orgs"
        fi
        API_BASE="${OWNER_TYPE}/${PACKAGE_OWNER}/packages/container/${PACKAGE_NAME}"

        # Para cada package version: tag Version* + id.
        # Saltamos la que tiene tag latest (build actual).
        VERSIONS=$(gh api "${API_BASE}/versions" --paginate 2>/dev/null \
          --jq "
            .[]
            | . as \$v
            | (\$v.metadata.container.tags // [])
            | select(any(. == \"latest\") | not)
            | first(select(startswith(\"Version\"))) as \$vt
            | select(\$vt != null)
            | \"\(\$vt) \(\$v.id)\"
          " || echo "")

        if [ -z "${VERSIONS}" ]; then
          echo "No old Version tags to clean up"
          exit 0
        fi

        # Sort by Version tag descending, keep top 10, delete the rest
        echo "${VERSIONS}" \
          | sort -r \
          | tail -n +11 \
          | awk '{print $2}' \
          | while read -r VERSION_ID; do
              echo "Deleting GHCR version ${VERSION_ID}..."
              gh api -X DELETE "${API_BASE}/versions/${VERSION_ID}" || true
            done

        echo "GHCR cleanup complete (kept latest 10 Version tags)"
