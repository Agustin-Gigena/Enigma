name: 'Run Tests'
description: 'Build, install Playwright, and run all tests (unit + E2E). Requires MySQL to be running.'

inputs:
  mysql-host:
    description: 'MySQL host'
    default: 'localhost'
  mysql-port:
    description: 'MySQL port'
    default: '3306'
  mysql-database:
    description: 'MySQL database name'
    default: 'enigma_db'
  mysql-user:
    description: 'MySQL user'
    default: 'enigma'
  mysql-password:
    description: 'MySQL password'
    default: 'enigma_dev_password'
  jwt-secret:
    description: 'JWT secret for tests (min 32 bytes)'
    default: 'ci-test-secret-that-is-at-least-32-bytes'

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      run: dotnet restore Enigma.slnx
      shell: bash

    - name: Install Playwright CLI
      run: dotnet tool install --global Microsoft.Playwright.CLI
      shell: bash

    - name: Install Playwright browsers
      run: playwright install --with-deps chromium
      shell: bash

    - name: Run all tests
      run: dotnet test
      shell: bash
      env:
        ASPNETCORE_ENVIRONMENT: Development
        MYSQL_HOST: ${{ inputs.mysql-host }}
        MYSQL_PORT: ${{ inputs.mysql-port }}
        MYSQL_DATABASE: ${{ inputs.mysql-database }}
        MYSQL_USER: ${{ inputs.mysql-user }}
        MYSQL_PASSWORD: ${{ inputs.mysql-password }}
        ENIGMA_JWT_SECRET: ${{ inputs.jwt-secret }}

    - name: Run mutation tests
      run: bash Tests/mutation.run.sh
      shell: bash
      env:
        ASPNETCORE_ENVIRONMENT: Development
        MYSQL_HOST: ${{ inputs.mysql-host }}
        MYSQL_PORT: ${{ inputs.mysql-port }}
        MYSQL_DATABASE: ${{ inputs.mysql-database }}
        MYSQL_USER: ${{ inputs.mysql-user }}
        MYSQL_PASSWORD: ${{ inputs.mysql-password }}
        ENIGMA_JWT_SECRET: ${{ inputs.jwt-secret }}
