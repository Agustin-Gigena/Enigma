name: 'Run Tests'
description: 'Build, install Playwright, and run all tests (unit + E2E)'

inputs:
  mysql-host:
    description: 'MySQL host'
    default: 'localhost'
  mysql-port:
    description: 'MySQL port'
    default: '3306'
  mysql-database:
    description: 'MySQL database name'
    default: 'enigma_db'
  mysql-user:
    description: 'MySQL user'
    default: 'enigma'
  mysql-password:
    description: 'MySQL password'
    default: 'enigma_dev_password'
  jwt-secret:
    description: 'JWT secret for tests (min 32 bytes)'
    default: 'ci-test-secret-that-is-at-least-32-bytes'
  skip-e2e:
    description: 'Skip E2E tests (Playwright)'
    default: 'false'

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      run: dotnet restore Enigma.slnx
      shell: bash

    - name: Build
      run: dotnet build Enigma.slnx --no-restore
      shell: bash

    - name: Install Playwright browsers
      if: inputs.skip-e2e != 'true'
      run: pwsh Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium
      shell: bash

    - name: Run unit tests
      run: dotnet test Tests/Enigma.Test.csproj --filter "FullyQualifiedName!~LoginFlowTest" --no-build
      shell: bash
      env:
        ASPNETCORE_ENVIRONMENT: Development
        MYSQL_HOST: ${{ inputs.mysql-host }}
        MYSQL_PORT: ${{ inputs.mysql-port }}
        MYSQL_DATABASE: ${{ inputs.mysql-database }}
        MYSQL_USER: ${{ inputs.mysql-user }}
        MYSQL_PASSWORD: ${{ inputs.mysql-password }}
        ENIGMA_JWT_SECRET: ${{ inputs.jwt-secret }}

    - name: Run E2E tests
      if: inputs.skip-e2e != 'true'
      run: dotnet test Tests/Enigma.Test.csproj --filter "FullyQualifiedName~LoginFlowTest" --no-build
      shell: bash
      env:
        ASPNETCORE_ENVIRONMENT: Development
        MYSQL_HOST: ${{ inputs.mysql-host }}
        MYSQL_PORT: ${{ inputs.mysql-port }}
        MYSQL_DATABASE: ${{ inputs.mysql-database }}
        MYSQL_USER: ${{ inputs.mysql-user }}
        MYSQL_PASSWORD: ${{ inputs.mysql-password }}
        ENIGMA_JWT_SECRET: ${{ inputs.jwt-secret }}
