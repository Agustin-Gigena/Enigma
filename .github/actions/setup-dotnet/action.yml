name: Setup .NET + dotnet-ef
description: Instala el SDK de .NET 10 y la herramienta dotnet-ef global. Prepara el runner para operar sobre el repo Enigma (restore, build, migraciones EF Core). Versiones fijas (hardcodeadas): SDK 10.0.x, dotnet-ef 10.0.0 (matchea Microsoft.EntityFrameworkCore.* del Server).

runs:
  using: "composite"
  steps:
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: "10.0.x"
        cache: false

    - name: Install dotnet-ef (global tool)
      shell: bash
      run: |
        set -euo pipefail
        dotnet tool install --global dotnet-ef \
          --version "10.0.0" \
          --architecture x64
        echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
        dotnet ef --version

    - name: Restore dependencies
      shell: bash
      run: |
        set -euo pipefail
        dotnet restore Enigma.slnx

    - name: Build Server (required for dotnet ef --no-build in sync-db)
      shell: bash
      run: |
        set -euo pipefail
        dotnet build Server/Enigma.Server.csproj --no-restore
