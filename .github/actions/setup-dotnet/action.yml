name: Setup .NET + dotnet-ef
description: 'Instala el SDK de .NET 10 y la herramienta dotnet-ef global. Prepara el runner para cualquier operacion .NET sobre el repo (migraciones EF Core, build, test). Versiones fijas: SDK 10.0.x, dotnet-ef 10.0.0.'

runs:
  using: "composite"
  steps:
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: "10.0.x"
        cache: true

    - name: Install dotnet-ef (global tool)
      shell: bash
      run: |
        set -euo pipefail
        dotnet tool install --global dotnet-ef \
          --version "10.0.0" \
          --architecture x64
        echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
        dotnet ef --version

    - name: Restore dependencies
      shell: bash
      run: |
        set -euo pipefail
        dotnet restore
