---
pre-commit:
  jobs:
    - name: architecture
      run: >-
        dotnet build Server/Enigma.Server.csproj --nologo &&
        dotnet build Client/Enigma.Client.csproj --nologo

pre-push:
  jobs:
    - name: validate
      run: scripts/validate.sh


commit-msg:
  jobs:
    - name: conventional
      run: |
        commit_msg=$(head -1 "{1}")
        if ! echo "$commit_msg" | grep -qE \
          '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9_.-]+\))?:[[:space:]]+.+$'; then
          echo "Error: no cumple Conventional Commits." >&2
          echo "Formato: <type>(<scope>): <desc>" >&2
          exit 1
        fi
