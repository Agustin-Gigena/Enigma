pre-commit:
  commands:
    yaml-lint:
      run: bash ./scripts/validate-yaml.sh
      root: true
    validate:
      run: bash ./scripts/validate.sh
      root: true
pre-push:
  commands:
    yaml-lint:
      run: bash ./scripts/validate-yaml.sh
      root: true
    validate:
      run: bash ./scripts/validate.sh
      root: true
commit-msg:
  commands:
    conventional:
      run: bash ./scripts/validate-commit-msg.sh $1
      root: true
