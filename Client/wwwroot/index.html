<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enigma</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/svg+xml" href="images/icon-invert.svg" />
    <link rel="icon" type="image/jpeg" href="images/logo_size.jpg" />
    <meta name="description" content="Enigma — la plataforma de tu institución." />
    <meta name="theme-color" content="#0E3736" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="images/logo_size.jpg" />
    <link href="Enigma.Client.styles.css" rel="stylesheet" />
    <script>
        // Aplica el tema antes del primer render: preferencia guardada, o la del sistema.
        (function () {
            var t = localStorage.getItem('enigma_theme');
            if (t !== 'light' && t !== 'dark') {
                t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
</head>

<body>
    <div id="app">
        <div class="loading-screen">
            <div class="loading-screen__aurora loading-screen__aurora--a"></div>
            <div class="loading-screen__aurora loading-screen__aurora--b"></div>
            <div class="loading-screen__motes">
                <span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span>
            </div>
            <div class="loading-screen__center">
                <svg class="loading-screen__ring" viewBox="0 0 160 160">
                    <circle class="loading-screen__ring-track" cx="80" cy="80" r="72" />
                    <circle class="loading-screen__ring-fill" cx="80" cy="80" r="72" />
                </svg>
                <img class="loading-screen__logo" src="images/logo_size_invert.svg" alt="" draggable="false" />
            </div>
            <div class="loading-screen__brand">Enigma</div>
            <div class="loading-screen__status"></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        Ocurrió un error inesperado.
        <a href="." class="reload">Recargar</a>
        <span class="dismiss" aria-label="Descartar">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <path d="M5 5l14 14M19 5L5 19" />
            </svg>
        </span>
    </div>
    <script>
        // Bridge: convert --blazor-load-percentage (e.g. "50%") into a stroke-dasharray
        // length for the loading ring. stroke-dasharray does not accept percentages.
        (function () {
            var CIRCUMFERENCE = 2 * Math.PI * 72; // r=72 from the SVG
            var ring = null;
            function update() {
                var el = document.documentElement;
                var raw = el.style.getPropertyValue('--blazor-load-percentage');
                if (!raw) return;
                var pct = parseFloat(raw);
                if (isNaN(pct)) return;
                if (!ring) ring = document.querySelector('.loading-screen__ring-fill');
                if (ring) {
                    var dash = (CIRCUMFERENCE * pct) / 100;
                    ring.style.strokeDasharray = dash + ' ' + CIRCUMFERENCE;
                }
            }
            // Observe inline style changes on <html> (Blazor sets via element.style)
            var observer = new MutationObserver(update);
            observer.observe(document.documentElement, {
                attributes: true,
                attributeFilter: ['style']
            });
        })();
    </script>
    <script src="js/login-motion.js"></script>
    <script src="js/enigma-menu.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js');
        }
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
