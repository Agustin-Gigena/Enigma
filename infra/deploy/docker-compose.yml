# Stack de producción en la VPS: Api (imagen GHCR) contra Aiven (MySQL
# gestionado externo) + Caddy (TLS). Deploy manual por ahora:
# docker compose pull && docker compose up -d
# La DB NO vive acá: MYSQL_HOST/PORT apuntan al servicio Aiven (exige TLS:
# MYSQL_SSL_MODE=REQUIRED).
services:
  api:
    image: ghcr.io/agustin-gigena/enigma-server:latest
    restart: unless-stopped
    environment:
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_SSL_MODE: ${MYSQL_SSL_MODE:-REQUIRED}
      ENIGMA_JWT_SECRET: ${ENIGMA_JWT_SECRET}
      ENIGMA_AUTH_REQUIRED: "true"
      ENIGMA_CORS_ORIGINS: ${ENIGMA_CORS_ORIGINS}
    expose:
      - "8081"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  caddy-data:
  caddy-config:
